{% extends "orders/base.html" %}
{% block title %}Sign up - Bites{% endblock %}
{% block content %}
<div class="auth card">
  <h1 class="sec">Create your account</h1>
  <form method="post">{% csrf_token %}
    <input type="hidden" name="next" value="{{ next }}">
    {% include "orders/_form.html" %}
    <button class="primary">Sign up</button>
  </form>
  <p class="muted">Already have an account? <a href="{% url 'login' %}{% if next %}?next={{ next|urlencode }}{% endif %}">Log in</a></p>
</div>
{% endblock %}
